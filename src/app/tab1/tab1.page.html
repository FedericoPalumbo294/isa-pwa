<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Biblioteca</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (cargando()) {
    <div class="ion-padding ion-text-center"><ion-spinner></ion-spinner></div>
  } @else if (error()) {
    <p class="ion-padding ion-text-center">{{ error() }}</p>
  } @else {
    <ion-list>
      @for (libro of libros(); track libro.id) {
        <ion-item>
          <ion-label>
            <h2>{{ libro.titulo }}</h2>
            <p>{{ libro.autor }}</p>
          </ion-label>
          <ion-note slot="end">{{ libro.anio }}</ion-note>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
